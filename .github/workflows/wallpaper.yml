name: wallpaper
on:
  schedule:
    - cron: "5 23 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow && python gen.py
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add wallpaper.png
          git commit -m "update" || exit 0
          git push
